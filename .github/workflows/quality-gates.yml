name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - gemini-account-pool
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11.10.0"

jobs:
  quality:
    name: Required Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static analysis
        run: pnpm check:static

      - name: TypeScript
        run: pnpm typecheck

      - name: Test TypeScript
        run: pnpm typecheck:tests

      - name: Architecture
        run: pnpm check:arch

      - name: Unit tests
        run: pnpm unit

      - name: Smoke test
        run: pnpm smoke

      - name: Bundle size
        run: pnpm check:size

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Docker smoke
        run: node scripts/docker-smoke.mjs
