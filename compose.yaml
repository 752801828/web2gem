services:
  web2gem:
    build: .
    image: "${WEB2GEM_IMAGE:-web2gem-account-pool:local}"
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${PORT:-52389}:${PORT:-52389}"
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-52389}"
      SQLITE_PATH: "${SQLITE_PATH:-/data/web2gem.sqlite}"
      SQLITE_BUSY_TIMEOUT_MS: "${SQLITE_BUSY_TIMEOUT_MS:-5000}"
      API_KEYS: "${API_KEYS:-}"
      ADMIN_KEY: "${ADMIN_KEY:-}"
      GEMINI_BL: "${GEMINI_BL:-}"
      GEMINI_ORIGIN: "${GEMINI_ORIGIN:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-gemini-3.5-flash}"
      RETRY_ATTEMPTS: "${RETRY_ATTEMPTS:-}"
      GEMINI_ACCOUNT_MAX_ATTEMPTS: "${GEMINI_ACCOUNT_MAX_ATTEMPTS:-}"
      GEMINI_ACCOUNT_REFRESH_INTERVAL_SEC: "${GEMINI_ACCOUNT_REFRESH_INTERVAL_SEC:-}"
      GEMINI_ACCOUNT_CAPABILITY_TTL_SEC: "${GEMINI_ACCOUNT_CAPABILITY_TTL_SEC:-}"
      GEMINI_ACCOUNT_CAPABILITY_MODE: "${GEMINI_ACCOUNT_CAPABILITY_MODE:-}"
      RETRY_DELAY_SEC: "${RETRY_DELAY_SEC:-}"
      REQUEST_TIMEOUT_SEC: "${REQUEST_TIMEOUT_SEC:-}"
      REQUEST_BODY_MAX_BYTES: "${REQUEST_BODY_MAX_BYTES:-67108864}"
      LOG_REQUESTS: "${LOG_REQUESTS:-}"
      CURRENT_INPUT_FILE_ENABLED: "${CURRENT_INPUT_FILE_ENABLED:-}"
      CURRENT_INPUT_FILE_MIN_BYTES: "${CURRENT_INPUT_FILE_MIN_BYTES:-}"
      GENERIC_FILE_UPLOAD_MAX_BYTES: "${GENERIC_FILE_UPLOAD_MAX_BYTES:-}"
    volumes:
      - web2gem-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '52389') + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  web2gem-data:
